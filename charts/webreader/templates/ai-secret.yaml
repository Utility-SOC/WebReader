{{- $remote := not (has .Values.ai.captionProvider (list "local" "none")) -}}
{{- if $remote }}
{{- if not (or .Values.ai.existingSecret .Values.ai.apiKey) }}
{{- fail (printf "ai.captionProvider=%s needs ai.existingSecret or ai.apiKey" .Values.ai.captionProvider) }}
{{- end }}
{{- if not .Values.ai.model }}
{{- fail (printf "ai.captionProvider=%s needs ai.model (a vision-capable model name)" .Values.ai.captionProvider) }}
{{- end }}
{{- end }}
{{- if and $remote (not .Values.ai.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webreader.fullname" . }}-llm
  labels:
    {{- include "webreader.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEBREADER_LLM_API_KEY: {{ .Values.ai.apiKey | quote }}
{{- end }}
