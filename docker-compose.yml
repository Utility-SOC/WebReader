services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./temp_uploads:/app/backend/temp_uploads
      - ./layouts:/app/backend/layouts
      - ./data:/app/backend/data
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TESSERACT_CMD=/usr/bin/tesseract
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./temp_uploads:/app/backend/temp_uploads
      - ./layouts:/app/backend/layouts
      - ./data:/app/backend/data
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TESSERACT_CMD=/usr/bin/tesseract
    depends_on:
      - redis
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - API_TARGET=http://backend:8000
    depends_on:
      - backend

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
